# محسن — همه دامنه‌های مشتری و پنل از همین بلاک عبور می‌کنند.
# مسیر پنل را nginx نمی‌داند؛ جنگو آن را با MOHSEN_WEB_PASS جدا می‌کند.

upstream mohsen_app {
    server 127.0.0.1:8790;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 8787 default_server;
    listen [::]:8787 default_server;
    server_name _;

    client_max_body_size 80m;
    server_tokens off;

    location /static/ {
        alias /opt/mohsen/staticfiles/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://mohsen_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
