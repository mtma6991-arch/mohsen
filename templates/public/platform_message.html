<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3efe6;font-family:Tahoma,sans-serif}main{max-width:520px;padding:2rem}code{direction:ltr;display:block;white-space:pre-wrap}</style>
</head>
<body>
  <main>
    <h1>{{ title }}</h1>
    <p>{{ body }}</p>
    {% if detail %}<code>{{ detail }}</code>{% endif %}
  </main>
</body>
</html>
