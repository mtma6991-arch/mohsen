{% extends "panel/base.html" %}
{% block title %}رمز{% endblock %}
{% block heading %}تغییر رمز پنل{% endblock %}
{% block content %}
<form method="post" class="card form-card" style="max-width:480px">
  {% csrf_token %}
  {% for field in form %}<label>{{ field.label }}{{ field }}{{ field.errors }}</label>{% endfor %}
  <button class="btn" type="submit">ذخیره رمز</button>
</form>
{% endblock %}
